<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="bot/vicunita-bot.css?v=20260311-3">
  <title>Bot de Lourdes Ortiz</title>

  <link rel="preload" as="image" href="fondos (2).png" />
  <link rel="preload" as="image" href="avatar.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primario:#0198a4;
      --secundario:#1a8689;
      --texto:#ffffff;
      --muted:rgba(255,255,255,.88);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:'Montserrat',sans-serif;
      background:url('fondos (2).png') no-repeat center center fixed;
      background-size:cover;
      color:var(--texto);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(1,152,164,.45),
        rgba(26,134,137,.35)
      );
      z-index:0;
      pointer-events:none;
    }

    .logo-lourdes{
      position:fixed;
      left:20px;
      top:50%;
      transform:translateY(-50%);
      height:60px;
      opacity:.18;
      pointer-events:none;
      z-index:1;
    }

    /* Vicuñita decorativa: oculta en desktop */
    #vicunita-index{
      display:none;
      position:fixed;
      right:-48px;
      top:42%;
      bottom:auto;
      width:170px;
      max-width:none;
      max-height:none;
      object-fit:contain;
      opacity:.11;
      pointer-events:none;
      z-index:1;
      filter:drop-shadow(0 10px 25px rgba(0,0,0,.12));
      animation:flotarVicunita 5.5s ease-in-out infinite;
    }

    @keyframes flotarVicunita{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    header{
      position:relative;
      z-index:2;
      text-align:center;
      padding:60px 20px 30px;
    }

    header h1{
      font-size:clamp(2rem,4vw,2.8rem);
      font-weight:800;
      margin:0 0 15px;
      line-height:1.1;
    }

    header p{
      font-size:1.1rem;
      margin:0;
      color:var(--muted);
    }

    header p + p{
      margin-top:8px;
    }

    main{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      padding:20px;
      width:min(100%, 600px);
      max-width:600px;
      margin:0 auto;
    }

    .btn{
      width:100%;
      padding:16px;
      font-size:1.05rem;
      font-weight:600;
      border-radius:14px;
      border:none;
      cursor:pointer;
      background:linear-gradient(135deg,var(--primario),var(--secundario));
      color:white;
      transition:.25s ease;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
      position:relative;
      z-index:2;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 40px rgba(0,0,0,.25);
    }

    footer{
      margin-top:auto;
      text-align:center;
      padding:20px;
      position:relative;
      z-index:2;
      font-size:.9rem;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .social-icons a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }

    .social-icons img{
      width:18px;
      height:18px;
      object-fit:contain;
      transition:.2s;
      display:block;
    }

    .social-icons img:hover{
      transform:scale(1.1);
    }

    /* TABLET */
    @media (max-width: 1024px){
      main{
        max-width:560px;
      }
    }

    /* MOBILE */
    @media (max-width:768px){
      body{
        background-position:center top;
      }

      .logo-lourdes{
        position:absolute;
        left:14px;
        top:14px;
        transform:none;
        height:38px;
        opacity:.22;
      }

      #vicunita-index{
        display:block;
        position:fixed;
        right:-48px;
        top:42%;
        bottom:auto;
        width:170px;
        max-width:none;
        max-height:none;
        opacity:.11;
        z-index:1;
      }

      header{
        padding:80px 16px 18px;
      }

      header h1{
        font-size:clamp(1.8rem, 8vw, 2.3rem);
        line-height:1.08;
      }

      header p{
        font-size:1rem;
      }

      main{
        width:100%;
        max-width:100%;
        padding:12px 14px 20px;
        gap:14px;
      }

      .btn{
        font-size:1rem;
        padding:15px 14px;
        border-radius:12px;
      }

      footer{
        padding:20px 14px 26px;
        font-size:.85rem;
      }

      .social-icons{
        gap:16px;
      }
    }

    /* MOBILE PEQUEÑO */
    @media (max-width:480px){
      #vicunita-index{
        display:block;
        right:-52px;
        top:43%;
        width:145px;
        opacity:.10;
      }

      header{
        padding:78px 14px 16px;
      }

      header h1{
        font-size:clamp(1.65rem, 8vw, 2rem);
      }

      header p{
        font-size:.96rem;
      }

      main{
        padding:10px 12px 18px;
        gap:12px;
      }

      .btn{
        font-size:.96rem;
        padding:14px 12px;
      }

      footer{
        padding:18px 12px 24px;
      }
    }
  </style>
</head>

<body>
  <img src="logo-lou.png" class="logo-lourdes" alt="Logo Lourdes Ortiz">
  <img src="avatar.png?v=20260311" id="vicunita-index" alt="Vicuñita decorativa">

  <header>
    <h1>¡Hola! Soy Vicuñita</h1>
    <p>Estoy acá para ayudarte y guiarte.</p>
    <p>Participá, consultá, proponé ideas y seguí proyectos en curso.</p>
  </header>

  <main>
    <button class="btn" onclick="location.href='reclamos.html'">📌 Realizar una Sugerencia</button>
    <button class="btn" onclick="location.href='proyectos.html'">📚 Proyectos Legislativos</button>
    <button class="btn" onclick="location.href='declaraciones.html'">📄 Declaraciones y Reconocimientos Legislativos</button>
    <button class="btn" onclick="location.href='ideas.html'">💡 Proponer una Idea</button>
    <button class="btn" onclick="location.href='companeros.html'">👥 Conocé a mis compañeros</button>
    <button class="btn" onclick="location.href='funcion-legislatura.html'">🏛️ ¿Conocés cuál es la función de la Legislatura?</button>
  </main>

  <div id="vicunita-bot-root"></div>
  <script src="bot/vicunita-bot.js?v=20260224-3" defer></script>

  <footer>
    <div class="social-icons">
      <a href="https://www.instagram.com/lourortiz" target="_blank" rel="noopener noreferrer">
        <img src="logo ig.png" alt="Instagram">
      </a>
      <a href="https://www.facebook.com/lourdes.ortiz.277" target="_blank" rel="noopener noreferrer">
        <img src="logo fb.png" alt="Facebook">
      </a>
      <a href="https://x.com/Lourdez_ortiz" target="_blank" rel="noopener noreferrer">
        <img src="logo x.png" alt="X">
      </a>
    </div>
    Creado por PB – © 2025
  </footer>
</body>
</html>
