<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot de Lourdes Ortiz</title>
  <link rel="preload" as="image" href="fondos (2).png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primario: #0198a4;
      --secundario: #1a8689;
      --blanco: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: url('fondos (2).png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* LOGO lateral Lourdes */
    .logo-lourdes-lateral {
      position: fixed;
      left: 15px;
      top: 52%;
      transform: translateY(-50%);
      height: 72px;
      z-index: 100;
    }
     @media screen and (max-width: 768px) {
  .logo-lourdes-lateral {
    top: 20px;
    left: 10px;
    transform: none;
    height: 22px;
  }
}
    header {
  text-align: center;
  padding: 1.2rem 0.8rem;
  background-color: rgba(1, 152, 164, 0.85);
  color: var(--blanco);
}

header h1 {
  font-size: 2.8rem; /* Aumentado para igualar el otro */
  margin-bottom: 0.5rem;
  font-weight: 700;
}

header p {
  font-size: 1.2rem; /* También igualado */
  margin: 0;
  font-weight: 500;
}


    .botones {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    .botones button {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 1rem 1.5rem;
      background-color: var(--primario);
      color: white;
      border: 2px solid white;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .botones button:hover {
      background-color: var(--secundario);
      transform: scale(1.05);
    }

    footer {
      background-color: var(--secundario);
      color: white;
      padding: 0.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      margin-top: auto;
      font-size: 0.85rem;
    }

    footer .social-icons {
      display: flex;
      gap: 10px;
    }

    footer .social-icons img {
      width: 18px;
      height: 18px;
      transition: transform 0.3s;
    }

    footer .social-icons img:hover {
      transform: scale(1.1);
    }
     @media screen and (max-width: 600px) {
    header h1 {
      font-size: 1.4rem;
    }

    header p {
      font-size: 0.85rem;
    }

    .logo-lourdes-lateral {
      height: 50px;
      left: 5px;
    }
  }
</style>
</head>

<body>

  <!-- Logo lateral Lourdes -->
  <img src="logo-lou.png" alt="Logo Lourdes Ortiz" class="logo-lourdes-lateral">

  <!-- ENCABEZADO -->
  <header>
    <h1>¡Hola! Soy Vicuñita</h1>
    <p>estoy acá para ayudarte y guiarte.</p>
    <p>Participá, consultá, proponé ideas y seguí proyectos en curso.</p>
  </header>

  <!-- BOTONES -->
  <main>
    <nav class="botones">
      <button onclick="location.href='reclamos.html'">📌 Realizar una Sugerencia</button>
      <button onclick="location.href='proyectos.html'">📚 Ver Proyectos Legislativos</button>
      <button onclick="location.href='declaraciones.html'">📄 Declaraciones de Interés</button>
      <button onclick="location.href='ideas.html'">💡 Proponer una Idea</button>
      <button onclick="location.href='funcion-legislatura.html'">🏛️ ¿Conocés cuál es la función de la Legislatura?</button>
    </nav>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="social-icons">
      <a href="https://www.instagram.com/lourortiz" target="_blank"><img src="logo ig.png" alt="Instagram"></a>
      <a href="https://www.facebook.com/lourdes.ortiz.277" target="_blank"><img src="logo fb.png" alt="Facebook"></a>
      <a href="https://x.com/Lourdez_ortiz" target="_blank"><img src="logo x.png" alt="x"></a>
    </div>
    <div>Creado por PB – © 2025</div>
  </footer>

</body>
</html>
