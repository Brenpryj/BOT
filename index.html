<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="bot/vicunita-bot.css?v=20260224-2">
  <title>Bot de Lourdes Ortiz</title>

  <link rel="preload" as="image" href="fondos (2).png" />
  <link rel="preload" as="image" href="vicu.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primario:#0198a4;
      --secundario:#1a8689;
      --texto:#ffffff;
      --muted:rgba(255,255,255,.88);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:'Montserrat',sans-serif;
      background:url('fondos (2).png') no-repeat center center fixed;
      background-size:cover;
      color:var(--texto);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* Capa institucional suave */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(1,152,164,.45),
        rgba(26,134,137,.35)
      );
      z-index:0;
      pointer-events:none;
    }

    /* Logo Lourdes lateral */
    .logo-lourdes{
      position:fixed;
      left:20px;
      top:50%;
      transform:translateY(-50%);
      height:60px;
      opacity:.18;
      pointer-events:none;
      z-index:1;
    }

    /* Vicuñita */
    #vicunita-index{
      position:fixed;
      right:-10px;
      bottom:-10px;
      width:min(520px, 42vw);
      max-height:86vh;
      pointer-events:none;
      z-index:1;
    }

    header{
      position:relative;
      z-index:2;
      text-align:center;
      padding:60px 20px 30px;
    }

    header h1{
      font-size:clamp(2rem,4vw,2.8rem);
      font-weight:800;
      margin:0 0 15px;
    }

    header p{
      font-size:1.1rem;
      margin:0;
      color:var(--muted);
    }

    header p + p{
      margin-top:8px;
    }

    main{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      padding:20px;
      max-width:600px;
      margin:0 auto;
    }

    .btn{
      width:100%;
      padding:16px;
      font-size:1.05rem;
      font-weight:600;
      border-radius:14px;
      border:none;
      cursor:pointer;
      background:linear-gradient(135deg,var(--primario),var(--secundario));
      color:white;
      transition:.25s ease;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 40px rgba(0,0,0,.25);
    }

    footer{
      margin-top:auto;
      text-align:center;
      padding:20px;
      position:relative;
      z-index:2;
      font-size:.9rem;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-bottom:10px;
    }

    .social-icons img{
      width:18px;
      transition:.2s;
    }

    .social-icons img:hover{
      transform:scale(1.1);
    }

    /* MOBILE */
    @media (max-width:768px){

      .logo-lourdes{
        height:40px;
        top:15px;
        transform:none;
      }

      #vicunita-index{
        position:absolute;
        width:75vw;
        opacity:.25;
      }

      header{
        padding-top:80px;
      }

      main{
        padding:15px;
      }
    }
  </style>
</head>

<body>

  <img src="logo-lou.png" class="logo-lourdes" alt="Logo Lourdes Ortiz">
  <img src="vicu.png" id="vicunita-index" alt="Vicuñita">

  <header>
    <h1>¡Hola! Soy Vicuñita</h1>
    <p>Estoy acá para ayudarte y guiarte.</p>
    <p>Participá, consultá, proponé ideas y seguí proyectos en curso.</p>
  </header>

  <main>
    <button class="btn" onclick="location.href='reclamos.html'">📌 Realizar una Sugerencia</button>
    <button class="btn" onclick="location.href='proyectos.html'">📚 Ver Proyectos Legislativos</button>
    <button class="btn" onclick="location.href='declaraciones.html'">📄 Declaraciones de Interés</button>
    <button class="btn" onclick="location.href='ideas.html'">💡 Proponer una Idea</button>
    <button class="btn" onclick="location.href='funcion-legislatura.html'">🏛️ ¿Conocés cuál es la función de la Legislatura?</button>
  </main>

  <div id="vicunita-bot-root"></div>
  <script src="bot/vicunita-bot.js?v=20260224-3" defer></script>

  <footer>
    <div class="social-icons">
      <a href="https://www.instagram.com/lourortiz" target="_blank"><img src="logo ig.png"></a>
      <a href="https://www.facebook.com/lourdes.ortiz.277" target="_blank"><img src="logo fb.png"></a>
      <a href="https://x.com/Lourdez_ortiz" target="_blank"><img src="logo x.png"></a>
    </div>
    Creado por PB – © 2025
  </footer>

</body>
</html>
