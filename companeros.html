<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conocé a mis compañeros</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primario:#0198a4;
      --secundario:#1a8689;
      --texto:#ffffff;
      --muted:rgba(255,255,255,.88);
      --card:rgba(255,255,255,.12);
      --card-border:rgba(255,255,255,.18);
      --shadow:0 18px 45px rgba(0,0,0,.18);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:'Montserrat',sans-serif;
      background:url('fondos (2).png') no-repeat center center fixed;
      background-size:cover;
      color:var(--texto);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(1,152,164,.45),
        rgba(26,134,137,.35)
      );
      z-index:0;
      pointer-events:none;
    }

    .logo-lourdes{
      position:fixed;
      left:20px;
      top:50%;
      transform:translateY(-50%);
      height:60px;
      opacity:.18;
      pointer-events:none;
      z-index:1;
    }

    #vicunita-companeros{
      position:fixed;
      right:-10px;
      bottom:0;
      width:min(500px, 38vw);
      max-width:500px;
      max-height:80vh;
      pointer-events:none;
      z-index:1;
      object-fit:contain;
      opacity:.95;
    }

    header{
      position:relative;
      z-index:2;
      text-align:center;
      padding:60px 20px 24px;
    }

    header h1{
      margin:0 0 12px;
      font-size:clamp(2rem,4vw,2.7rem);
      font-weight:800;
      line-height:1.1;
    }

    header p{
      margin:0;
      color:var(--muted);
      font-size:1.05rem;
    }

    .contenedor{
      position:relative;
      z-index:2;
      width:min(1100px, 100%);
      margin:0 auto;
      padding:10px 20px 30px;
    }

    .bloque-canva{
      max-width:980px;
      margin:0 auto;
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:22px;
      padding:28px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      transition:.25s ease;
    }

    .bloque-canva:hover{
      transform:translateY(-4px);
      background:rgba(255,255,255,.16);
    }

    .canva-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .canva-info{
      flex:1;
      min-width:260px;
    }

    .canva-badge{
      display:inline-block;
      margin-bottom:12px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      font-size:.9rem;
      font-weight:700;
    }

    .bloque-canva h2{
      margin:0 0 10px;
      font-size:1.5rem;
      font-weight:800;
    }

    .bloque-canva p{
      margin:0 0 18px;
      color:var(--muted);
      line-height:1.5;
      font-size:.98rem;
    }

    .canva-acciones{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      padding:13px 16px;
      border-radius:14px;
      font-weight:700;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:.2s ease;
      cursor:pointer;
    }

    .btn-primario{
      background:linear-gradient(135deg,var(--primario),var(--secundario));
      color:#fff;
      box-shadow:0 10px 24px rgba(0,0,0,.15);
    }

    .btn-secundario{
      background:rgba(255,255,255,.14);
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .canva-frame{
      position:relative;
      width:100%;
      padding-top:56.25%;
      overflow:hidden;
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.2);
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
    }

    .canva-frame iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:none;
    }

    .nota{
      margin-top:16px;
      font-size:.92rem;
      text-align:center;
      color:rgba(255,255,255,.82);
    }

    .zona-volver{
      position:relative;
      z-index:2;
      text-align:center;
      padding:10px 20px 34px;
    }

    .btn-volver{
      padding:14px 22px;
      background:rgba(255,255,255,.14);
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      border-radius:14px;
      text-decoration:none;
    }

    /* FOOTER UNIFICADO */

    footer{
      margin-top:auto;
      text-align:center;
      padding:24px 20px 18px;
      position:relative;
      z-index:2;
      font-size:.9rem;
      color:white;
    }

    .footer-title{
      margin:0 0 10px;
      font-size:.88rem;
      font-weight:600;
      opacity:.95;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .social-icons a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }

    .social-icons img{
      width:18px;
      height:18px;
      object-fit:contain;
      transition:.2s;
      display:block;
    }

    .social-icons img:hover{
      transform:scale(1.1);
    }

    .footer-equipo{
      margin:10px 0 5px;
      font-size:.82rem;
      font-weight:500;
      opacity:.88;
    }

    .footer-credit{
      margin:0;
      font-size:.76rem;
      font-weight:400;
      opacity:.68;
    }

    @media (max-width:768px){
      header{
        padding:80px 16px 20px;
      }

      .bloque-canva{
        padding:20px;
      }

      .canva-acciones{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <img src="logo-lou.png" class="logo-lourdes" alt="">
  <img src="vicu.png" id="vicunita-companeros" alt="">

  <header>
    <h1>Conocé a mis compañeros</h1>
  </header>

  <section class="contenedor">

    <section class="bloque-canva">

      <div class="canva-header">

        <div class="canva-info">
    
          <h2>Equipo y presentación</h2>
        </div>

        <div class="canva-acciones">

          <a class="btn btn-primario"
             href="https://www.canva.com/design/DAHGSI5zvIQ/1zzjxgWF6jOPIhcqjDWlBw/view"
             target="_blank">
            Abrir en Canva
          </a>

          <a class="btn btn-secundario" href="#visor">
            Ver presentación
          </a>

        </div>

      </div>

      <div class="canva-frame" id="visor">
        <iframe
          loading="lazy"
          src="https://www.canva.com/design/DAHGSI5zvIQ/1zzjxgWF6jOPIhcqjDWlBw/view?embed"
          allowfullscreen>
        </iframe>
      </div>

    </section>

  </section>

  <div class="zona-volver">
    <a class="btn-volver" href="index.html">⬅ Volver al inicio</a>
  </div>


  <!-- FOOTER -->

  <footer class="footer">

    <p class="footer-title">
      Seguinos en nuestras redes
    </p>

    <div class="social-icons">

      <a href="https://www.instagram.com/lourortiz"
         target="_blank"
         rel="noopener noreferrer">
        <img src="logo ig.png" alt="Instagram">
      </a>

      <a href="https://www.facebook.com/lourdes.ortiz.277"
         target="_blank"
         rel="noopener noreferrer">
        <img src="logo fb.png" alt="Facebook">
      </a>

      <a href="https://x.com/Lourdez_ortiz"
         target="_blank"
         rel="noopener noreferrer">
        <img src="logo x.png" alt="X">
      </a>

    </div>

    <p class="footer-equipo">
      Equipo de la Diputada Lourdes Ortiz · La Rioja
    </p>

    <p class="footer-credit">
      VicuBot © 2026 · Desarrollado por BP
    </p>

  </footer>

</body>
</html>
